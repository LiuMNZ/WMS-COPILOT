server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  ai:
    dashscope:
      # 仅通过环境变量 DASHSCOPE_API_KEY 注入，勿在仓库中写真实密钥
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 当前推荐：使用腾讯云 MCP 查询真实 CLS 日志。
    #   - 保持 spring.ai.mcp.client.enabled=true
    #   - 保持 cls.mock-enabled=false
    #   - 本地通过环境变量 TENCENT_MCP_SSE_ENDPOINT 注入控制台给出的 SSE 路径
    #
    # 如需临时切回本地 Mock 日志：
    #   1. 将 cls.mock-enabled 改为 true
    #   2. 需要确保代码里不强依赖 MCP 的 ToolCallbackProvider（否则关闭 MCP 可能导致启动失败）
    #   3. 本地 Mock 日志来自 QueryLogsTools，只用于演示/测试，不会查询真实腾讯云 CLS
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              # 控制台给出的完整 SSE 路径；勿提交明文，用环境变量 TENCENT_MCP_SSE_ENDPOINT
              sse-endpoint: ${TENCENT_MCP_SSE_ENDPOINT}

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY}
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称

# Prometheus 配置
# 当前本地没有 Prometheus 监听 9090，因此先启用 mock，避免工具调用时报 Connection refused。
# 如果后续启动了真实 Prometheus，请改为 false，并确认 prometheus.base-url 指向真实地址。
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: true  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
# 当前推荐：false，表示不注册本地 QueryLogsTools Mock 日志工具，日志查询交给腾讯云 MCP。
# 如果后续没有 MCP 或只想本地演示，可改为 true；此时 QueryLogsTools 才会注册，并返回模拟日志数据。
cls:
  mock-enabled: false  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）
